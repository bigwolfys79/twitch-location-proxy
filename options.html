<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Twitch Location Proxy</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 560px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #efeff1;
      background: #0e0e10;
    }
    h1 { font-size: 1.2rem; }
    label { display: block; margin: 1rem 0 .3rem; font-weight: 600; }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: .5rem .6rem;
      border-radius: 6px;
      border: 1px solid #3a3a3d;
      background: #1f1f23;
      color: #efeff1;
      font-size: .95rem;
    }
    .row { display: flex; align-items: center; gap: .5rem; margin-top: 1rem; }
    button {
      padding: .5rem 1.2rem;
      border: none;
      border-radius: 6px;
      background: #9147ff;
      color: #fff;
      font-size: .95rem;
      cursor: pointer;
    }
    button:hover { background: #772ce8; }
    #status { color: #4cbd6b; margin-left: .5rem; }
    .hint { color: #adadb8; font-size: .85rem; margin-top: .4rem; }
  </style>
</head>
<body>
  <h1>Twitch Location Proxy</h1>

  <label for="enabled">
    <input type="checkbox" id="enabled"> Включить проксирование
  </label>

  <label for="worker">Адрес Cloudflare Worker</label>
  <input type="text" id="worker" placeholder="https://your-worker.workers.dev" spellcheck="false">
  <p class="hint">
    Через этот Worker идут только служебные запросы (usher.ttvnw.net и video-weaver.*.ttvnw.net).
    Видеосегменты всегда качаются напрямую.
  </p>

  <div class="row">
    <button id="save">Сохранить</button>
    <button id="help" style="background:#2e2e35">Справка (GitHub)</button>
    <span id="status"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
